plugins {
	id 'dev.kikugie.loom-back-compat'
	id 'maven-publish'
}

version = project.mod_version
// Stonecutter uses the project group internally; publication declares its own groupId.

def mcVersion = project.minecraft_version
def requiredJava = project.java_version.toInteger()
tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion.set("${project.mod_version}+mc${mcVersion}")
}

base {
	archivesName = project.archives_base_name
}

repositories {
	// Required for Cloth Config.
	maven { url "https://maven.shedaniel.me/" }

	// Required for Mod Menu.
	maven { url "https://maven.terraformersmc.com/releases/" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Selects remap + Mojang mappings on 1.21.x, no mappings/remap on 26.x.
	loomx.applyMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional integration with Mod Menu.
	modApi "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Configuration library.
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
}

def resourceProperties = [
	version: project.version,
	mod_id: project.mod_id,
	minecraft_version: project.minecraft_version,
	loader_version: project.loader_version,
	java_version: project.java_version,
	fabric_api_version: project.fabric_api_version,
	cloth_version: project.cloth_version,
	modmenu_version: project.modmenu_version
]

tasks.named("processResources", ProcessResources) {
	inputs.properties(resourceProperties)

	filesMatching("fabric.mod.json") {
		expand(resourceProperties)
	}
}

tasks.named("processClientResources", ProcessResources) {
	inputs.properties(resourceProperties)

	filesMatching("fabric.mod.json") {
		expand(resourceProperties)
	}
	filesMatching('*.mixins.json') {
		expand(java_version: project.java_version)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = requiredJava
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(requiredJava)
	}

	sourceCompatibility = JavaVersion.toVersion(requiredJava)
	targetCompatibility = JavaVersion.toVersion(requiredJava)
}

// Exercise the production swap guard with real Minecraft packets, without launching a client.
sourceSets.test.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath

tasks.register('offhandRegressionTest', JavaExec) {
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.mrkoszos.safeoffhand.mixin.OffhandSwapRegressionTest'
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(requiredJava)
	}
}

tasks.named('test') {
	// This dependency-free suite has a main entry point rather than JUnit annotations.
	failOnNoDiscoveredTests = false
	dependsOn tasks.named('offhandRegressionTest')
}

jar {
	archiveBaseName.set(project.archives_base_name)
	archiveVersion.set("${project.mod_version}+mc${mcVersion}")
	archiveClassifier.set("")

	from(rootProject.file("LICENSE")) {
		rename { "${it}_${project.archives_base_name}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			groupId = project.maven_group
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
