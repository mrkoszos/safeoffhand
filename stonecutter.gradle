plugins {
	id 'dev.kikugie.stonecutter'
}

stonecutter.active '26.2'

tasks.register('buildAll') {
	group = 'build'
	dependsOn subprojects.collect { "${it.path}:build" }
}

tasks.register('regressionAll') {
	group = 'verification'
	dependsOn subprojects.collect { "${it.path}:offhandRegressionTest" }
}

tasks.register('buildActive') {
	group = 'build'
	dependsOn ":${stonecutter.current.project}:build"
}

tasks.register('collectJars', Sync) {
	group = 'build'
	dependsOn tasks.named('buildAll')
	from(subprojects.collect { it.loomx.modJar.flatMap { task -> task.archiveFile } })
	into layout.buildDirectory.dir('libs')
}

tasks.register('verifyJars') {
	group = 'verification'
	dependsOn tasks.named('collectJars')
	doLast {
		subprojects.each { target ->
			def obfuscated = target.minecraft_version.startsWith('1.')
			assert target.plugins.hasPlugin(obfuscated
				? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom')
			def jarFile = target.loomx.modJar.get().archiveFile.get().asFile
			new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
				def json = new groovy.json.JsonSlurper()
				def metadata = json.parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
				def mixin = json.parse(zip.getInputStream(zip.getEntry('safeoffhand.client.mixins.json')))
				assert metadata.id == 'safeoffhand'
				assert metadata.version == '1.0.1'
				assert metadata.depends.minecraft == target.minecraft_version
				assert metadata.depends.java == ">=${target.java_version}"
				assert metadata.depends.fabricloader == ">=${target.loader_version}"
				assert metadata.depends['fabric-api'] == ">=${target.fabric_api_version}"
				assert metadata.depends['cloth-config'] == ">=${target.cloth_version}"
				assert metadata.suggests.modmenu == ">=${target.modmenu_version}"
				assert mixin.compatibilityLevel == "JAVA_${target.java_version}"
				def classFile = zip.getEntry('com/mrkoszos/safeoffhand/mixin/ClientCommonPacketListenerImplMixin.class')
				def input = new DataInputStream(zip.getInputStream(classFile))
				assert input.readInt() == (int) 0xCAFEBABE
				input.readUnsignedShort()
				assert input.readUnsignedShort() == target.java_version.toInteger() + 44
				assert jarFile.name == "safeoffhand-1.0.1+mc${target.minecraft_version}.jar"
				logger.lifecycle("Verified ${jarFile.name}")
			}
		}
	}
}
